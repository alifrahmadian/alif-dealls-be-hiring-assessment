root = "."
tmp_dir = "tmp"

[build]
    cmd = "go run ./cmd"
    bin = "tmp/main"
    full_bin = ""
    exclude_dir = ["tmp"]
    include_ext = ["go", "tpl", "tmpl", "html"]
    exclude_file = ["*_test.go"]
    follow_symlink = false
    kill_delay = "0s"

[log]
    time = true

[color]
    main = "yellow"
    watcher = "cyan"
    build = "green"

delay = 1000